<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Fondo circular con gradiente rosa PedidosYa -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF3F6C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c2185b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="moto" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0d0d8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Fondo -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>

  <!-- Sombra suave debajo de la moto -->
  <ellipse cx="262" cy="370" rx="130" ry="14" fill="rgba(0,0,0,0.18)"/>

  <!-- ── RUEDA TRASERA ── -->
  <circle cx="168" cy="348" r="52" fill="none" stroke="white" stroke-width="18"/>
  <circle cx="168" cy="348" r="18" fill="white"/>
  <!-- radios -->
  <line x1="168" y1="296" x2="168" y2="400" stroke="#FF3F6C" stroke-width="4"/>
  <line x1="116" y1="348" x2="220" y2="348" stroke="#FF3F6C" stroke-width="4"/>
  <line x1="131" y1="311" x2="205" y2="385" stroke="#FF3F6C" stroke-width="3"/>
  <line x1="205" y1="311" x2="131" y2="385" stroke="#FF3F6C" stroke-width="3"/>

  <!-- ── RUEDA DELANTERA ── -->
  <circle cx="352" cy="348" r="52" fill="none" stroke="white" stroke-width="18"/>
  <circle cx="352" cy="348" r="18" fill="white"/>
  <!-- radios -->
  <line x1="352" y1="296" x2="352" y2="400" stroke="#FF3F6C" stroke-width="4"/>
  <line x1="300" y1="348" x2="404" y2="348" stroke="#FF3F6C" stroke-width="4"/>
  <line x1="315" y1="311" x2="389" y2="385" stroke="#FF3F6C" stroke-width="3"/>
  <line x1="389" y1="311" x2="315" y2="385" stroke="#FF3F6C" stroke-width="3"/>

  <!-- ── CHASIS DE LA MOTO ── -->
  <!-- Cuerpo principal -->
  <path d="M180 340 L200 285 L270 270 L330 280 L355 300 L355 340 Z"
        fill="white" stroke="white" stroke-width="2" stroke-linejoin="round"/>
  <!-- Guardabarro trasero -->
  <path d="M168 298 Q175 275 200 268 L210 278 Q188 285 180 305 Z" fill="white"/>
  <!-- Guardabarro delantero -->
  <path d="M352 298 Q360 278 368 272 L375 282 Q366 288 360 305 Z" fill="white"/>
  <!-- Carenado lateral -->
  <path d="M200 285 Q240 260 295 262 L310 278 L270 282 Z"
        fill="#f0d0d8" stroke="white" stroke-width="1"/>
  <!-- Asiento -->
  <path d="M200 275 Q235 255 295 258 L300 268 Q260 265 205 285 Z"
        fill="white" rx="6"/>
  <!-- Tubo de escape -->
  <path d="M188 330 Q170 338 155 335" fill="none" stroke="white" stroke-width="7" stroke-linecap="round"/>
  <!-- Manubrio -->
  <path d="M340 272 L355 258 L368 262" fill="none" stroke="white" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Faro -->
  <circle cx="370" cy="282" r="10" fill="#FFF9C4" stroke="white" stroke-width="3"/>

  <!-- ── RIDER (REPARTIDOR) ── -->
  <!-- Cuerpo / chaqueta -->
  <path d="M215 278 Q225 225 248 215 Q268 208 280 218 L290 260 Q270 268 245 272 Z"
        fill="white"/>
  <!-- Mochila / caja de delivery en la espalda -->
  <rect x="217" y="225" width="34" height="40" rx="5" ry="5"
        fill="#FF3F6C" stroke="white" stroke-width="3"/>
  <!-- Cruz en la caja -->
  <line x1="234" y1="228" x2="234" y2="262" stroke="white" stroke-width="3"/>
  <line x1="219" y1="245" x2="249" y2="245" stroke="white" stroke-width="3"/>

  <!-- Brazo derecho (hacia manubrio) -->
  <path d="M282 228 Q312 240 335 262" fill="none" stroke="white" stroke-width="11" stroke-linecap="round"/>
  <!-- Mano en manubrio -->
  <circle cx="338" cy="264" r="8" fill="white"/>

  <!-- Pierna -->
  <path d="M278 262 Q290 285 300 295 L285 300 Q272 285 265 270 Z" fill="white"/>

  <!-- Cuello -->
  <rect x="255" y="200" width="18" height="16" rx="4" fill="#FFCCBC"/>

  <!-- ── CASCO ── -->
  <!-- Casco principal -->
  <ellipse cx="264" cy="188" rx="36" ry="32" fill="white"/>
  <!-- Visera oscura -->
  <path d="M232 192 Q248 208 280 208 Q296 200 296 192 Q280 202 248 202 Z"
        fill="#FF3F6C" opacity="0.85"/>
  <!-- Brillo del casco -->
  <ellipse cx="252" cy="174" rx="12" ry="8" fill="white" opacity="0.35"/>

  <!-- ── VELOCIDAD (líneas de movimiento) ── -->
  <line x1="88" y1="298" x2="132" y2="298" stroke="white" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
  <line x1="72" y1="318" x2="120" y2="318" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.45"/>
  <line x1="92" y1="338" x2="128" y2="338" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
</svg>
